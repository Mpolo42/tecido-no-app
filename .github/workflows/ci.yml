name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-fund
      - name: Lint
        run: npm run lint
      - name: Test application security rules
        run: npm test
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Report build-tool advisories
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Build with public test configuration
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-public-placeholder

  database-security:
    name: database-security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.121.0
      - name: Start disposable local database
        run: supabase db start
      - name: Apply migrations to local database
        run: supabase db reset --local --no-seed
      - name: Test grants, RLS and administrative assurance
        run: supabase test db --local
      - name: Stop disposable CI database
        if: always()
        run: supabase stop --no-backup
